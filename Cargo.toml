[package]
name    = "overlay_stats"
version = "0.1.0"
edition = "2021"

[dependencies]
sysinfo    = "0.29"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon  = "0.19"

[dependencies.windows]
version  = "0.56"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level     = 3    
lto           = true   
codegen-units = 1     
strip         = true   
panic         = "abort" 

[profile.dev]
opt-level = 1       